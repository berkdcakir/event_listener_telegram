version: "3.9"
services:
  go-sender:
    build:
      context: .
      dockerfile: go-sender/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      TELEGRAM_CHAT_ID_2: ${TELEGRAM_CHAT_ID_2}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      WALLET_PROFILE: ${WALLET_PROFILE:-prod}
      DEBUG_MODE: ${DEBUG_MODE:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped

  watcher:
    build:
      context: .
      dockerfile: viem-watcher/Dockerfile
    environment:
      # RPC/ANKR değişkenleriniz
      ARBITRUM_HTTP_RPC: ${ARBITRUM_HTTP_RPC}
      ANKR_API_KEY: ${ANKR_API_KEY}
      # Go servise bildirim
      NOTIFIER_URL: http://go-sender:8080/notify
      BACKEND_API_URL: http://go-sender:8080
      WATCH_ADDRESSES: ${WATCH_ADDRESSES}
      TOKEN_LIST: ${TOKEN_LIST}
      POLL_MS: ${POLL_MS:-3000}
      CHUNK_BLOCKS: ${CHUNK_BLOCKS:-4000}
      CONFIRMATIONS: ${CONFIRMATIONS:-12}
      BACKFILL_BLOCKS: ${BACKFILL_BLOCKS:-0}
    volumes:
      - ./listener/abis:/app/listener/abis:ro
    depends_on:
      - go-sender
    restart: unless-stopped