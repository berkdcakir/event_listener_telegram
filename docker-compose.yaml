version: "3.9"
services:
  go-sender:
    build:
      context: .
      dockerfile: go-sender/Dockerfile
    env_file:
      - go-sender/.env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
    ports:
      - "8080:8080"
    restart: unless-stopped

  watcher:
    build:
      context: .
      dockerfile: viem-watcher/Dockerfile
    env_file:
      - viem-watcher/.env
    environment:
      # Go servise bildirim
      NOTIFIER_URL: http://go-sender:8080/notify
      BACKEND_API_URL: http://go-sender:8080
    volumes:
      - ./listener/abis:/app/listener/abis:ro
    depends_on:
      - go-sender
    restart: unless-stopped